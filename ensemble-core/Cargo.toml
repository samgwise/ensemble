[package]
name = "ensemble-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ensemble-values = { path = "../ensemble-values" }
ensemble-protocol = { path = "../ensemble-protocol" }
ensemble-manifest = { path = "../ensemble-manifest" }
ensemble-clock = { path = "../ensemble-clock" }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tokio = { version = "1", features = ["io-util"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
