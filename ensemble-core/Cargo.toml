[package]
name = "ensemble-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, wire protocol codec, and re-exports for the Ensemble protocol"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
ensemble-values = { version = "0.1.0", path = "../ensemble-values" }
ensemble-protocol = { version = "0.1.0", path = "../ensemble-protocol" }
ensemble-manifest = { version = "0.1.0", path = "../ensemble-manifest" }
ensemble-clock = { version = "0.1.0", path = "../ensemble-clock" }
ensemble-discovery = { version = "0.1.0", path = "../ensemble-discovery" }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
tokio = { version = "1", features = ["io-util"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
