[package]
name = "ensemble-bridge-osc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OSC bridge for Ensemble — translates between Ensemble actions and OSC/UDP"
readme = "README.md"

[[bin]]
name = "ensemble-bridge-osc"
path = "src/main.rs"

[dependencies]
ensemble-client = { version = "0.1.0", path = "../ensemble-client" }
ensemble-core = { version = "0.1.0", path = "../ensemble-core" }
ensemble-discovery = { version = "0.1.0", path = "../ensemble-discovery" }
tokio = { version = "1", features = ["full"] }
rosc = "0.11"
anyhow = "1"
serde_json = "1"
