allow-branch = ["main"]
sign-commit = false
sign-tag = false
tag-name = "{{crate_name}}-v{{version}}"
# cargo-release renders {{crate_name}} in tag-name but NOT in this template,
# and the version bump is workspace-wide, so the message names the version only.
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "{{crate_name}} v{{version}}"
# Tag-only: crates.io publishing happens in the release workflow (release.yml)
# once the pushed tag triggers it — publishing here too would race the workflow.
publish = false
