name: Release

on:
  push:
    tags:
      - '*-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev libraries (for midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Run tests
        run: cargo test --workspace -- --test-threads=1

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev libraries (for midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Extract crate name from tag
        id: crate
        # Strip the trailing "-v<version>" — sed's 's/-v.*$//' would also cut
        # crate names containing "-v" (e.g. ensemble-values -> "ensemble").
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "CRATE_NAME=${TAG%-v*}" >> $GITHUB_OUTPUT
      - name: Login to crates.io
        run: cargo login ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish crate
        run: cargo publish -p ${{ steps.crate.outputs.CRATE_NAME }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract crate name and version from tag
        id: info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          CRATE_NAME=${TAG%-v*}
          VERSION=${TAG#*-v}
          echo "CRATE_NAME=$CRATE_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.info.outputs.CRATE_NAME }} v${{ steps.info.outputs.VERSION }}
          generate_release_notes: true
