[workspace]
members = [
    "ensemble-core",
    "ensemble-values",
    "ensemble-routing",
    "ensemble-protocol",
    "ensemble-manifest",
    "ensemble-clock",
    "ensemble-discovery",
    "ensemble-hub",
    "ensemble-hub-tui",
    "ensemble-client",
    "ensemble-bridge-midi",
    "ensemble-bridge-osc",
    "ensemble-test-fixtures",
    "ensemble-conformance",
    "ensemble-demo-euclidean",
    "ensemble-demo-pitch-cycler",
    "ensemble-bridge-remote",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A hub-and-spoke protocol for interconnecting small music applications"
repository = "https://github.com/samgwise/ensemble"
homepage = "https://github.com/samgwise/ensemble"
keywords = ["music", "osc", "midi", "protocol", "real-time"]
categories = ["multimedia::audio"]
